[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
lefthook = "2.2.1"

[tasks.check]
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings", "cargo test --workspace", "cargo clippy -p spa-codec-aptx-adaptive --all-targets --features dev-replay -- -D warnings", "cargo test -p spa-codec-aptx-adaptive --features dev-replay --lib"]

[tasks.install-plugin]
run = "./scripts/install-plugin.sh"
