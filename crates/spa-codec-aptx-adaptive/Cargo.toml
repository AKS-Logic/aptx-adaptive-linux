[package]
name = "spa-codec-aptx-adaptive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aptx-adaptive = { path = "../aptx-adaptive" }
aptx-native = { path = "../aptx-native" }
# The ported C plugin's codec backend is the same C ABI the C plugin links
# (-laptx_native); no Rust source from the native crate is pulled in.

[features]
# DEV ONLY: honour APTX_ADAPTIVE_REPLAY (see src/dev.rs). Off in normal installs.
dev-replay = []


[lints]
workspace = true

[dev-dependencies]
aptx-adaptive = { path = "../aptx-adaptive", features = ["fake"] }
libloading = "0.9.0"
