# aptx-linux: loads the aptX Adaptive guard (docs/adr/0004-aptx-slot.md).
# Installed by scripts/install-plugin.sh for APTX_ADAPTIVE_SLOT=aptx only.
wireplumber.components = [
  {
    name = aptx-linux/aptx-adaptive-guard.lua, type = script/lua
    provides = hooks.aptx-adaptive.guard
  }
]

wireplumber.profiles = {
  main = {
    hooks.aptx-adaptive.guard = required
  }
}
