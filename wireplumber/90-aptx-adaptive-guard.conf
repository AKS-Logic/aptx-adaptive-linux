# aptx-linux: loads the aptX Adaptive guard (docs/adr/0004-aptx-slot.md).
# Installed by scripts/install-plugin.sh for APTX_ADAPTIVE_SLOT=aptx only.
#
# In a WirePlumber 0.5 profile, "optional" alone never loads a component, and "required" makes
# the whole profile fail if it can't load. So a required virtual component *wants* the guard:
# it's always pulled in, and if the script fails to load WirePlumber logs it and carries on.
wireplumber.components = [
  {
    name = aptx-linux/aptx-adaptive-guard.lua, type = script/lua
    provides = hooks.aptx-adaptive.guard
  }
  {
    type = virtual, provides = aptx-adaptive.guard-loader
    wants = [ hooks.aptx-adaptive.guard ]
  }
]

wireplumber.profiles = {
  main = {
    aptx-adaptive.guard-loader = required
    hooks.aptx-adaptive.guard = optional
  }
}
